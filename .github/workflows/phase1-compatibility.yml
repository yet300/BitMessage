name: Phase 1 compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and execute the offline compatibility gate
        run: tools/ci/phase1-compatibility-gate.sh
      - name: Upload compatibility test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-test-report
          path: core/testing/build/reports/tests/testAndroidHostTest/
          if-no-files-found: error
